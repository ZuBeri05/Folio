name: Switch CI

on:
  push:
    branches: [ switch ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ switch ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          echo "DEVKITPRO=$DEVKITPRO"
          "$DEVKITPRO/devkitA64/bin/aarch64-none-elf-gcc" --version | head -1
          cat $DEVKITPRO/libnx/switch.specs

      - name: Build NRO
        run: make -j"$(nproc)" V=1

      - name: Verify embedded fonts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import struct
          data = Path('folio.nro').read_bytes()
          assert data[16:20] == b'NRO0', 'Invalid NRO header'
          asset_start = struct.unpack_from('<I', data, 24)[0]
          assert data[asset_start:asset_start + 4] == b'ASET', 'Missing NRO assets'
          romfs_offset, romfs_size = struct.unpack_from('<QQ', data, asset_start + 40)
          romfs_start = asset_start + romfs_offset
          assert romfs_size > 0, 'Empty RomFS'
          assert romfs_start + romfs_size <= len(data), 'Truncated RomFS'
          romfs = data[romfs_start:romfs_start + romfs_size]
          for font in sorted(Path('res/fonts').glob('*.ttf')):
              assert font.read_bytes() in romfs, f'{font.name} missing from RomFS'
              print(f'Embedded: {font.name} ({font.stat().st_size:,} bytes)')
          print(f'NRO: {len(data):,} bytes; RomFS: {romfs_size:,} bytes')
          PY

      - name: Upload NRO
        uses: actions/upload-artifact@v4
        with:
          name: folio-nro
          path: folio.nro
          if-no-files-found: error

      - name: Upload debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: folio-debug-symbols
          path: |
            folio.elf
            build/folio.map
          if-no-files-found: error

      - name: Attach NRO to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: folio.nro
          generate_release_notes: true
