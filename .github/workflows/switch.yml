name: Switch CI

on:
  push:
    branches: [ switch ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ switch ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          echo "DEVKITPRO=$DEVKITPRO"
          aarch64-none-elf-gcc --version | head -1
          cat $DEVKITPRO/libnx/switch.specs

      - name: Build NRO
        run: make -j"$(nproc)" V=1

      - name: Inspect RomFS embedding
        run: |
          ls -la res/fonts
          echo "--- nro size ---"
          ls -la folio.nro
          echo "--- asset header ---"
          python3 - <<'PY'
          d = open('folio.nro','rb').read()
          import struct
          magic, size, hdrsize = struct.unpack('<III', d[4:16])
          print('magic off', hex(size), 'hdr', hdrsize, 'len', len(d))
          print('NRO0 at 16:', d[16:20])
          # read the first asset header entry
          print('tail ascii:', d[-64:][:40])
          PY

      - name: Upload NRO
        uses: actions/upload-artifact@v4
        with:
          name: folio-nro
          path: folio.nro
          if-no-files-found: error

      - name: Attach NRO to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: folio.nro
          generate_release_notes: true