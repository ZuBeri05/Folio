name: Android CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testPhoneDebugUnitTest --stacktrace

      - name: Build APKs (phone + wear, debug + release)
        run: ./gradlew assemblePhoneDebug assemblePhoneRelease assembleWearDebug assembleWearRelease --stacktrace

      # 开了 flavor 之后产物在 apk/<flavor>/<type>/ 下；release 和 debug 分开上传
      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: folio-debug-apks
          path: app/build/outputs/apk/*/debug/*.apk
          if-no-files-found: error

      - name: Upload release APKs
        uses: actions/upload-artifact@v4
        with:
          name: folio-release-apks
          path: app/build/outputs/apk/*/release/*.apk
          if-no-files-found: error

      # 打 tag 就自动发 Release，把签名好的 APK 挂上去
      - name: Attach APKs to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/*/release/*.apk
            app/build/outputs/apk/*/debug/*.apk
          generate_release_notes: true
